<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:sans-serif;background:#fff}.d{margin:10px;padding:10px;border:1px solid #ddd}</style></head><body>
%DIVS%
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
mermaid.initialize({startOnLoad:false, theme:"default", htmlLabels:false, class:{htmlLabels:false}, flowchart:{htmlLabels:false}});
window.log=[];
await mermaid.run({querySelector:".mermaid"});
for (const pre of document.querySelectorAll("pre.mermaid")) {
  const name = pre.dataset.name, svg = pre.querySelector("svg");
  svg.setAttribute("xmlns","http://www.w3.org/2000/svg");
  const bb = svg.viewBox.baseVal; svg.setAttribute("width", bb.width); svg.setAttribute("height", bb.height);
  svg.style.maxWidth = ""; svg.style.backgroundColor = "white";
  const text = new XMLSerializer().serializeToString(svg);
  await fetch("/save?name="+name+".svg", {method:"POST", body:text});
  try {
    const img = new Image(); const scale = 2;
    await new Promise((ok, err) => { img.onload = ok; img.onerror = err; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(text); });
    const c = document.createElement("canvas"); c.width = bb.width*scale; c.height = bb.height*scale;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    await fetch("/save?name="+name+".png", {method:"POST", body:blob});
    window.log.push(name+": svg+png");
  } catch(e) { window.log.push(name+": svg só ("+e+")"); }
}
window.done = true;
</script></body></html>
