<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<div id="host"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script type="module">
const src = await (await fetch("/etapa1/esbocos/esbocos.html?t=" + Date.now())).text();
const doc = new DOMParser().parseFromString(src, "text/html");
document.head.append(...doc.querySelectorAll("style"));
document.body.style.cssText = doc.body.style.cssText;
const host = document.getElementById("host"); host.innerHTML = doc.body.innerHTML;
window.log = [];
await document.fonts.ready;
for (const f of document.querySelectorAll(".frame")) {
  const c = await html2canvas(f, {scale: 2, backgroundColor: "#ffffff"});
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  await fetch("/save?name=etapa1/esbocos/img/" + f.dataset.name + ".png", {method: "POST", body: blob});
  window.log.push(f.dataset.name);
}
window.done = true;
</script></body></html>
